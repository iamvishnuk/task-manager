services:
  postgres:
    image: postgres:17-alpine
    container_name: task-manager-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    env_file:
      - apps/api/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-taskmanager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-taskmanager}'
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: task-manager-api
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - apps/api/.env
    environment:
      # Override DATABASE_URL so the API container reaches the 'postgres' service
      # by its Docker service name instead of 'localhost' (used for local dev in .env)
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-taskmanager}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: task-manager-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - apps/web/.env
    depends_on:
      - api

volumes:
  postgres_data:
