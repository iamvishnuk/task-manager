services:
  postgres:
    image: postgres:17-alpine
    container_name: task-manager-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-taskmanager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-taskmanager}'
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: task-manager-api
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      PORT: 8000
      NODE_ENV: development
      APP_ORIGIN: 'http://localhost:3000'
      API_PREFIX: '/api/v1'
      JWT_SECRET: 'your_secret_key'
      JWT_REFRESH_SECRET: 'your_refresh_secret_key'
      JWT_EXPIRES_IN: '1d'
      JWT_REFRESH_EXPIRES_IN: '7d'
      DATABASE_URL: 'postgresql://postgres:postgres@postgres:5432/taskmanager'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: 'http://localhost:8000/api/v1'
    container_name: task-manager-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: 'http://localhost:8000/api/v1'
    depends_on:
      - api

volumes:
  postgres_data:
